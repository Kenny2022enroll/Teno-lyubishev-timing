name: Android Build

# 在 push 到任意分支、提交 Pull Request 以及手动触发时运行
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: 校验最低支持 SDK 为 25
        run: |
          set -e
          echo "校验 app/build.gradle 中 minSdk 为 25..."
          grep -E "^\s*minSdk 25\b" app/build.gradle
          echo "校验通过：minSdk = 25 (Android 7.1)"

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 运行单元测试
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: 上传 Debug APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: lyubishchev-timing-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 上传构建报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
          retention-days: 7
